# This workflow builds a Watcharr image and pushes it to this fork's
# GitHub Container Registry: ghcr.io/ludsoft/watcharr
#
# Fork model (see AGENTS.md): `dev` mirrors upstream (sbondCo/Watcharr) and is
# never built here; our changes live on `ludsoft-dev` (default branch).
#
# Triggers:
#   - Push to `ludsoft-dev`          -> tags `ludsoft-dev` and `sha-<short sha>`.
#   - Push of a fork release tag     -> tags the version as is and `latest`
#     (ex: `v4.4.0-ludsoft.1.0.0`).
#   - Manual run (Actions tab)       -> `<branch>` and `sha-<short sha>`, any branch.
#
# Images are amd64 only (building arm64 under QEMU emulation took ~15 min).
#
# Releases don't rebuild: a release tag points to a commit that was just
# pushed to `ludsoft-dev`, so the tag run waits for that branch build and adds
# the release tags to its `sha-<short sha>` image (seconds). If there is no
# such image (branch build failed/cancelled, tag on another commit...), it
# falls back to testing and building as usual.
#
# Server tests, gofmt and web lint must pass before an image is built.

name: Release Watcharr Image

on:
  push:
    branches:
      - ludsoft-dev
    tags:
      # Fork release: v<upstream semver>-ludsoft.<fork semver>
      - 'v[0-9]+.[0-9]+.[0-9]+-ludsoft.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  # GHCR image names must be lowercase.
  image: ghcr.io/ludsoft/watcharr
  is_release: ${{ startsWith(github.ref, 'refs/tags/v') }}

# Only build the latest push of a ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Release tags only: find an already built image of this commit.
  find-image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      actions: read
      packages: read

    outputs:
      source: ${{ steps.find.outputs.source }}

    steps:
      - name: Wait for the ludsoft-dev build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" \
            --workflow container-release.yml --branch ludsoft-dev \
            --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "No ludsoft-dev build for $GITHUB_SHA."
            exit 0
          fi
          echo "Waiting for ludsoft-dev build $run_id..."
          gh run watch "$run_id" -R "$GITHUB_REPOSITORY" --exit-status --interval 30 \
            || echo "The ludsoft-dev build did not succeed."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for the image
        id: find
        run: |
          src="${image}:sha-${GITHUB_SHA::7}"
          if docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
            echo "Found $src, it will be re-tagged."
            echo "source=$src" >> "$GITHUB_OUTPUT"
          else
            echo "No $src, building."
          fi

  # Release tags only: add the release tags to the found image.
  retag-release:
    needs: find-image
    if: needs.find-image.outputs.source != ''
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add release tags
        env:
          SOURCE: ${{ needs.find-image.outputs.source }}
        run: |
          docker buildx imagetools create \
            -t "${image}:${GITHUB_REF_NAME}" \
            -t "${image}:latest" \
            "$SOURCE"
          echo "Tagged $SOURCE as ${image}:${GITHUB_REF_NAME} and latest."

  # Images are only built and pushed once these checks pass.
  test-server:
    needs: find-image
    # Runs when find-image was skipped (branch/manual) or found nothing.
    if: ${{ !cancelled() && needs.find-image.outputs.source == '' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "server/go.mod"
          cache-dependency-path: "server/go.sum"

      - name: go test all packages
        run: go test ./...

      - name: gofmt test
        run: |
          outp=$(gofmt -l .)
          if [ -n "$outp" ]; then
            echo "Need to fix formatting!"
            echo "$outp"
            exit 1
          fi

  test-web:
    needs: find-image
    if: ${{ !cancelled() && needs.find-image.outputs.source == '' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: "npm"

      - name: Get dependencies
        run: npm ci

      # TODO: Also run `npm run check` once the existing svelte-check
      #       errors (src/lib/Error.svelte) are fixed.
      - name: Check for linting/formatting errors
        run: npm run lint

  release-images:
    needs: [find-image, test-server, test-web]
    if: >-
      ${{ !cancelled()
      && needs.find-image.outputs.source == ''
      && needs.test-server.result == 'success'
      && needs.test-web.result == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.image }}
          flavor: |
            latest=false
          # Release tags are used as is (`-ludsoft.` is part of our version,
          # not a semver pre-release, so no type=semver here).
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ env.is_release }}

      - name: Tags decided
        run: echo "${{ steps.meta.outputs.tags }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
