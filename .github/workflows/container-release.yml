# This workflow builds a Watcharr image and pushes it to this fork's
# GitHub Container Registry: ghcr.io/ludsoft/watcharr
#
# Fork model (see AGENTS.md): `dev` mirrors upstream (sbondCo/Watcharr) and is
# never built here; our changes live on `ludsoft-dev` (default branch).
#
# Triggers:
#   - Push to `ludsoft-dev`          -> tags `ludsoft-dev` and `sha-<short sha>`.
#   - Push of a fork release tag     -> tags the version as is and `latest`
#     (ex: `v4.4.0-ludsoft.1.0.0`).
#   - Manual run (Actions tab)       -> `<branch>` and `sha-<short sha>`, any branch.
#
# Server tests, gofmt and web lint must pass before the image is built.
#
# Multi arch support doc/guide:
# https://docs.docker.com/build/ci/github-actions/multi-platform/

name: Release Watcharr Image

on:
  push:
    branches:
      - ludsoft-dev
    tags:
      # Fork release: v<upstream semver>-ludsoft.<fork semver>
      - 'v[0-9]+.[0-9]+.[0-9]+-ludsoft.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  # GHCR image names must be lowercase.
  image: ghcr.io/ludsoft/watcharr
  is_release: ${{ startsWith(github.ref, 'refs/tags/v') }}

# Only build the latest push of a ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Images are only built and pushed once these checks pass.
  test-server:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "server/go.mod"
          cache-dependency-path: "server/go.sum"

      - name: go test all packages
        run: go test ./...

      - name: gofmt test
        run: |
          outp=$(gofmt -l .)
          if [ -n "$outp" ]; then
            echo "Need to fix formatting!"
            echo "$outp"
            exit 1
          fi

  test-web:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: "npm"

      - name: Get dependencies
        run: npm ci

      # TODO: Also run `npm run check` once the existing svelte-check
      #       errors (src/lib/Error.svelte) are fixed.
      - name: Check for linting/formatting errors
        run: npm run lint

  release-images:
    needs: [test-server, test-web]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.image }}
          flavor: |
            latest=false
          # Release tags are used as is (`-ludsoft.` is part of our version,
          # not a semver pre-release, so no type=semver here).
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ env.is_release }}

      - name: Tags decided
        run: echo "${{ steps.meta.outputs.tags }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
